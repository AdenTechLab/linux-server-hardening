
name: Linux Security Audit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bash
        shell: bash
        run: |
          bash --version

      - name: Validate script syntax
        shell: bash
        run: |
          bash -n scripts/security-audit.sh
          bash -n tests/test-security-audit.sh

      - name: Run automated tests
        shell: bash
        run: |
          chmod +x tests/test-security-audit.sh
          ./tests/test-security-audit.sh
